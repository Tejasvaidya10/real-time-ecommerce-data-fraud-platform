name: ecommerce-fraud-platform

services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerce}
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce_dev_only}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ../data/runtime/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commerce} -d ${POSTGRES_DB:-commerce}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xms512m -Xmx768m
    ports:
      - "9092:9092"
    volumes:
      - ../data/runtime/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/project/create-topics.sh"]
    volumes:
      - ./kafka/create-topics.sh:/opt/project/create-topics.sh:ro
    restart: "no"
    mem_limit: 256m

  connect:
    image: quay.io/debezium/connect:3.6
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: ecommerce-fraud-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 1g

  generator:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: src/generator/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-commerce}:${POSTGRES_PASSWORD:-commerce_dev_only}@postgres:5432/${POSTGRES_DB:-commerce}
      GENERATOR_SEED: ${GENERATOR_SEED:-42}
      GENERATOR_EVENTS: ${GENERATOR_EVENTS:-1000}
      GENERATOR_RATE: ${GENERATOR_RATE:-25}
      GENERATOR_RUN_ID: ${GENERATOR_RUN_ID:-}
    restart: "no"
    mem_limit: 256m

  spark-bronze:
    profiles: ["processing"]
    image: apache/spark:4.0.1-scala2.13-java17-python3-ubuntu
    depends_on:
      kafka:
        condition: service_healthy
    user: "0:0"
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --packages
      - io.delta:delta-spark_2.13:4.0.1,org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1
      - /opt/project/spark/jobs/bronze_ingestion.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      LAKEHOUSE_ROOT: /opt/project/data/lakehouse
      CHECKPOINT_ROOT: /opt/project/data/checkpoints
      PYTHONPATH: /opt/project
    volumes:
      - ..:/opt/project
    mem_limit: 3g
    restart: unless-stopped

  spark-silver:
    profiles: ["processing"]
    image: apache/spark:4.0.1-scala2.13-java17-python3-ubuntu
    depends_on:
      spark-bronze:
        condition: service_started
    user: "0:0"
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 2g
      - --packages
      - io.delta:delta-spark_2.13:4.0.1
      - /opt/project/spark/jobs/silver_cdc.py
    environment:
      LAKEHOUSE_ROOT: /opt/project/data/lakehouse
      CHECKPOINT_ROOT: /opt/project/data/checkpoints
      PYTHONPATH: /opt/project
    volumes:
      - ..:/opt/project
    mem_limit: 3g
    restart: unless-stopped

  spark-fraud:
    profiles: ["processing"]
    image: apache/spark:4.0.1-scala2.13-java17-python3-ubuntu
    depends_on:
      kafka:
        condition: service_healthy
    user: "0:0"
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --packages
      - io.delta:delta-spark_2.13:4.0.1,org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1
      - /opt/project/spark/jobs/fraud_decisions.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      LAKEHOUSE_ROOT: /opt/project/data/lakehouse
      CHECKPOINT_ROOT: /opt/project/data/checkpoints
      PYTHONPATH: /opt/project
    volumes:
      - ..:/opt/project
    mem_limit: 3g
    restart: unless-stopped

  spark-gold:
    profiles: ["tools"]
    image: apache/spark:4.0.1-scala2.13-java17-python3-ubuntu
    depends_on:
      spark-silver:
        condition: service_started
      spark-fraud:
        condition: service_started
    user: "0:0"
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --packages
      - io.delta:delta-spark_2.13:4.0.1
      - /opt/project/spark/jobs/gold_analytics.py
    environment:
      LAKEHOUSE_ROOT: /opt/project/data/lakehouse
      DASHBOARD_EXPORT_PATH: /opt/project/data/exports/dashboard.json
      PYTHONPATH: /opt/project
    volumes:
      - ..:/opt/project
    mem_limit: 2g
    restart: "no"

  dashboard:
    profiles: ["dashboard"]
    image: python:3.12-alpine
    command: ["python", "-m", "http.server", "8080", "--directory", "/site"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../dashboard/index.html:/site/index.html:ro
      - ../dashboard/styles.css:/site/styles.css:ro
      - ../dashboard/app.js:/site/app.js:ro
      - ../data/exports:/site/data:ro
    mem_limit: 64m
    restart: unless-stopped
