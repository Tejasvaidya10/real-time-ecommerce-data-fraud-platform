name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create local configuration
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose -f infra/compose.yaml --env-file .env config --quiet
      - name: Compile Python
        run: python -m compileall -q src spark/jobs tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
